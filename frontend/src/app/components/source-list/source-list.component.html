<div class="sources">
  <button
    type="button"
    class="sources-toggle"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 3h7l5 5v13H7zM14 3v5h5"/>
    </svg>
    <span>{{ sources().length }} {{ sources().length === 1 ? 'source' : 'sources' }}</span>
    <svg class="icon chevron" [class.open]="open()" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </button>

  @if (open()) {
    <ol class="source-rows">
      @for (source of sources(); track source.source_id) {
        <li class="source-row" [title]="'Chunk ' + source.chunk_id + ' · sequence ' + source.sequence">
          <span class="idx">{{ source.rank }}</span>
          <span class="name">{{ source.filename }}</span>
          <span class="meta">{{ pages(source) }}</span>
          @if (source.distance > 0) {
            <span class="meta">{{ source.distance | number:'1.2-3' }}</span>
          }
        </li>
      }
    </ol>
  }
</div>

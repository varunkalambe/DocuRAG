services:
  - type: web
    name: pdf-rag-springboot
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter          # 512 MB. Use "standard" (2 GB) if the local embedding model runs out of memory
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: local
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /tmp/vector-data
